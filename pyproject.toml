[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shotkit"
version = "0.1.0"
description = "Parse shot specs and render prompts for video generators."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
shotkit = "shotkit.cli:main"

[tool.setuptools]
packages = ["shotkit"]
